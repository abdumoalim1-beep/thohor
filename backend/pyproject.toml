[project]
name = "mersad-backend"
version = "0.1.0"
description = "Store Visibility Growth Platform — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    "openai>=1.50",
    "anthropic>=0.36",
    "google-genai>=0.3",
    "tldextract>=5.1",
    "Pillow>=11.0",
    "playwright>=1.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default `pytest` run = unit suite only (no network, no external services).
# Integration tests (real network/providers) run explicitly via
# `pytest tests/integration`.
testpaths = ["tests/unit"]
